name: AAPP Apuntes Politicos Google Docs

on:
  schedule:
    # Miercoles 22:00 Argentina = jueves 01:00 UTC.
    # La logica quincenal se valida en scripts/should_run.py.
    - cron: '0 1 * * 4'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Forzar ejecucion aunque no corresponda semana quincenal (true/false)'
        required: false
        default: 'true'
      period_days:
        description: 'Cantidad de dias hacia atras a relevar'
        required: false
        default: '15'
      send_email:
        description: 'Enviar email con link al finalizar (true/false)'
        required: false
        default: 'true'
      disable_gemini:
        description: 'Desactivar Gemini y usar fallback deterministico (true/false)'
        required: false
        default: 'false'
      create_doc:
        description: 'Crear Google Doc (true/false)'
        required: false
        default: 'true'

jobs:
  generate-aapp-google-doc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Check fortnightly schedule
        id: schedule_check
        env:
          REPORT_TIMEZONE: America/Argentina/Buenos_Aires
          SCHEDULE_ANCHOR_DATE: ${{ vars.SCHEDULE_ANCHOR_DATE || '2026-05-06' }}
          RUN_EVERY_DAYS: ${{ vars.RUN_EVERY_DAYS || '14' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          SHOULD_RUN=$(python scripts/should_run.py --force "${FORCE_RUN}")
          echo "should_run=${SHOULD_RUN}" >> "$GITHUB_OUTPUT"
          echo "should_run=${SHOULD_RUN}"

      - name: Generate local smoke-test report
        if: steps.schedule_check.outputs.should_run == 'true'
        run: python scripts/generate_sample_report.py

      - name: Run AAPP Google Docs pipeline
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          REPORT_TIMEZONE: America/Argentina/Buenos_Aires
          PERIOD_DAYS: ${{ github.event.inputs.period_days || vars.REPORT_PERIOD_DAYS || '15' }}
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
          CREATE_GOOGLE_DOC: ${{ github.event.inputs.create_doc || 'true' }}
          AAPP_DISABLE_GEMINI: ${{ github.event.inputs.disable_gemini || 'false' }}
          AAPP_STRICT_LLM: ${{ vars.AAPP_STRICT_LLM || 'false' }}
          AAPP_MAX_RAW_NEWS: ${{ vars.AAPP_MAX_RAW_NEWS || '160' }}
          AAPP_MIN_CLUSTERS: ${{ vars.AAPP_MIN_CLUSTERS || '4' }}
          AAPP_MAX_CLUSTERS: ${{ vars.AAPP_MAX_CLUSTERS || '8' }}

          REPORT_ISSUE_NUMBER: ${{ vars.REPORT_ISSUE_NUMBER }}
          REPORT_TITLE_PREFIX: ${{ vars.REPORT_TITLE_PREFIX || 'Apuntes políticos' }}
          REPORT_INTERNAL_LABEL: ${{ vars.REPORT_INTERNAL_LABEL || 'NOTA INTERNA' }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS || 'gemini-2.0-flash' }}
          GEMINI_ENABLE_MODEL_FALLBACK: ${{ vars.GEMINI_ENABLE_MODEL_FALLBACK || 'true' }}
          GEMINI_MAX_RETRIES_PER_MODEL: ${{ vars.GEMINI_MAX_RETRIES_PER_MODEL || '3' }}
          GEMINI_INITIAL_BACKOFF_SECONDS: ${{ vars.GEMINI_INITIAL_BACKOFF_SECONDS || '3' }}
          GEMINI_MAX_BACKOFF_SECONDS: ${{ vars.GEMINI_MAX_BACKOFF_SECONDS || '30' }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TOKEN_URI: ${{ secrets.GOOGLE_TOKEN_URI || 'https://oauth2.googleapis.com/token' }}
          GOOGLE_DOCS_FOLDER_ID: ${{ secrets.GOOGLE_DOCS_FOLDER_ID }}
          GOOGLE_DOCS_SHARE_WITH: ${{ secrets.GOOGLE_DOCS_SHARE_WITH }}
          GOOGLE_DOCS_SHARE_ROLE: ${{ vars.GOOGLE_DOCS_SHARE_ROLE || 'writer' }}
          GOOGLE_DOCS_ANYONE_WITH_LINK: ${{ vars.GOOGLE_DOCS_ANYONE_WITH_LINK || 'false' }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          ARGS="--period-days ${PERIOD_DAYS} --max-raw-news ${AAPP_MAX_RAW_NEWS} --min-clusters ${AAPP_MIN_CLUSTERS} --max-clusters ${AAPP_MAX_CLUSTERS}"
          if [ "${SEND_EMAIL}" = "true" ]; then ARGS="$ARGS --send-email"; fi
          if [ "${AAPP_DISABLE_GEMINI}" = "true" ]; then ARGS="$ARGS --disable-gemini"; fi
          if [ "${CREATE_GOOGLE_DOC}" = "false" ]; then ARGS="$ARGS --no-create-doc"; fi
          python scripts/run_scheduled_report.py $ARGS

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aapp-google-doc-output
          path: |
            output/reports/**
            data/reports/**
            data/clusters/**
          if-no-files-found: warn
