name: AAPP Quincenal Report

on:
  schedule:
    - cron: '0 12 1,15 * *'
  workflow_dispatch:
    inputs:
      period_days:
        description: 'Cantidad de días hacia atrás a relevar'
        required: false
        default: '15'
      send_email:
        description: 'Enviar email al finalizar (true/false)'
        required: false
        default: 'true'
      disable_gemini:
        description: 'Desactivar Gemini y usar fallback determinístico (true/false)'
        required: false
        default: 'false'

jobs:
  generate-and-send-aapp-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Generate local smoke-test deck
        run: python scripts/generate_sample_report.py

      - name: Run AAPP report pipeline
        env:
          REPORT_TIMEZONE: America/Argentina/Buenos_Aires
          PERIOD_DAYS: ${{ github.event.inputs.period_days || '15' }}
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
          AAPP_DISABLE_GEMINI: ${{ github.event.inputs.disable_gemini || 'false' }}
          AAPP_MAX_NEWS: ${{ vars.AAPP_MAX_NEWS || '120' }}
          AAPP_SELECTED_NEWS: ${{ vars.AAPP_SELECTED_NEWS || '4' }}
          AAPP_STRICT_LLM: ${{ vars.AAPP_STRICT_LLM || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS || 'gemini-2.5-pro,gemini-2.0-flash' }}
          GEMINI_ENABLE_MODEL_FALLBACK: ${{ vars.GEMINI_ENABLE_MODEL_FALLBACK || 'true' }}
          GEMINI_MAX_RETRIES_PER_MODEL: ${{ vars.GEMINI_MAX_RETRIES_PER_MODEL || '3' }}
          GEMINI_INITIAL_BACKOFF_SECONDS: ${{ vars.GEMINI_INITIAL_BACKOFF_SECONDS || '3' }}
          GEMINI_MAX_BACKOFF_SECONDS: ${{ vars.GEMINI_MAX_BACKOFF_SECONDS || '30' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TOKEN_URI: ${{ secrets.GOOGLE_TOKEN_URI || 'https://oauth2.googleapis.com/token' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
        run: |
          ARGS="--period-days ${PERIOD_DAYS}"
          if [ "${SEND_EMAIL}" = "true" ]; then ARGS="$ARGS --send-email"; fi
          if [ "${AAPP_DISABLE_GEMINI}" = "true" ]; then ARGS="$ARGS --disable-gemini"; fi
          python scripts/run_scheduled_report.py $ARGS

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: aapp-report-output
          path: |
            output/reports/**
          if-no-files-found: error
